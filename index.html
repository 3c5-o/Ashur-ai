<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1110" />
  <title>Ashur AI</title>
  <style>
    :root{
      --bg:#0c1110;
      --panel:#121917;
      --panel-2:#18211e;
      --line:#26332e;
      --text:#f3f7f5;
      --muted:#92a09a;
      --accent:#36c578;
      --accent-2:#22995a;
      --danger:#ff6b75;
      --shadow:0 18px 60px rgba(0,0,0,.34);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at 50% -20%,rgba(54,197,120,.14),transparent 38%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
    }
    button,textarea,input{font:inherit}
    button{touch-action:manipulation}
    .shell{
      width:min(760px,100%);
      height:100dvh;
      margin:auto;
      display:flex;
      flex-direction:column;
      background:rgba(12,17,16,.78);
      border-inline:1px solid rgba(255,255,255,.03);
      backdrop-filter:blur(18px);
    }
    .topbar{
      min-height:72px;
      padding:14px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--line);
      background:rgba(18,25,23,.88);
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .logo{
      width:42px;height:42px;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(145deg,var(--accent),var(--accent-2));
      color:#07110c;font-weight:900;font-size:19px;
      box-shadow:0 8px 28px rgba(54,197,120,.22);
      flex:0 0 auto;
    }
    .brand-text{min-width:0}
    .brand-text h1{font-size:17px;margin:0 0 4px;font-weight:800}
    .state{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(54,197,120,.08)}
    .icon-btn{
      width:40px;height:40px;border:1px solid var(--line);
      border-radius:12px;background:var(--panel-2);color:var(--text);
      cursor:pointer;display:grid;place-items:center;
    }
    .icon-btn:active{transform:scale(.97)}
    .settings{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
      background:rgba(18,25,23,.65);
    }
    .settings .label{font-size:12px;color:var(--muted)}
    .temp-wrap{display:flex;align-items:center;gap:8px}
    .temp-wrap input{
      width:74px;padding:7px 9px;border-radius:10px;
      border:1px solid var(--line);background:var(--panel-2);color:var(--text);
      outline:none;
    }
    .chat{
      flex:1;overflow:auto;padding:20px 14px 120px;
      scroll-behavior:smooth;
    }
    .empty{
      min-height:100%;display:grid;place-items:center;text-align:center;padding:30px 20px;
      color:var(--muted);
    }
    .empty-card{max-width:460px}
    .empty-card .hero{
      width:68px;height:68px;border-radius:22px;margin:0 auto 18px;
      display:grid;place-items:center;font-weight:900;font-size:28px;
      color:#07110c;background:linear-gradient(145deg,var(--accent),var(--accent-2));
      box-shadow:0 14px 40px rgba(54,197,120,.18);
    }
    .empty h2{margin:0 0 9px;color:var(--text);font-size:21px}
    .empty p{margin:0;line-height:1.8;font-size:14px}
    .row{display:flex;margin:10px 0}
    .row.user{justify-content:flex-start}
    .row.ai{justify-content:flex-end}
    .bubble{
      max-width:min(86%,620px);
      padding:12px 14px;border-radius:17px;
      line-height:1.75;font-size:14px;white-space:pre-wrap;
      overflow-wrap:anywhere;box-shadow:0 6px 18px rgba(0,0,0,.08);
    }
    .user .bubble{
      background:linear-gradient(145deg,#2db56c,#248c57);
      color:#fff;border-bottom-right-radius:5px;
    }
    .ai .bubble{
      background:var(--panel-2);border:1px solid var(--line);
      color:var(--text);border-bottom-left-radius:5px;
    }
    .meta{font-size:10px;opacity:.6;margin-top:6px}
    .typing{
      display:inline-flex;gap:5px;align-items:center;
      min-width:58px;justify-content:center;
    }
    .typing i{
      width:6px;height:6px;border-radius:50%;background:var(--muted);
      animation:bounce 1s infinite ease-in-out;
    }
    .typing i:nth-child(2){animation-delay:.14s}
    .typing i:nth-child(3){animation-delay:.28s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-5px);opacity:1}}
    .error{
      margin:12px auto;max-width:92%;padding:11px 13px;border-radius:13px;
      border:1px solid rgba(255,107,117,.35);
      background:rgba(255,107,117,.08);color:#ffb4ba;font-size:12px;line-height:1.65;
    }
    .composer-wrap{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:min(760px,100%);padding:10px 12px 14px;
      background:linear-gradient(to top,var(--bg) 68%,rgba(12,17,16,0));
    }
    .composer{
      display:flex;align-items:flex-end;gap:9px;padding:8px;
      border:1px solid var(--line);border-radius:19px;
      background:#141c19;box-shadow:var(--shadow);
    }
    textarea{
      flex:1;min-height:46px;max-height:140px;resize:none;
      padding:12px 9px;border:0;outline:0;background:transparent;color:var(--text);
      line-height:1.5;
    }
    textarea::placeholder{color:#6f7c76}
    .send{
      width:46px;height:46px;border:0;border-radius:14px;
      background:linear-gradient(145deg,var(--accent),var(--accent-2));
      color:#07110c;font-size:21px;font-weight:900;cursor:pointer;
      display:grid;place-items:center;flex:0 0 auto;
    }
    .send:disabled{opacity:.45;cursor:not-allowed}
    .footnote{text-align:center;color:#66736d;font-size:10px;margin-top:7px}
    @media (min-width:760px){
      body{padding:18px}
      .shell{height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
      .composer-wrap{bottom:18px;width:760px;border-radius:0 0 24px 24px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
          <h1>Ashur AI</h1>
          <div class="state"><span class="dot"></span><span id="statusText">جاهز للتجربة</span></div>
        </div>
      </div>
      <button class="icon-btn" id="newChatBtn" type="button" title="محادثة جديدة" aria-label="محادثة جديدة">＋</button>
    </header>

    <section class="settings">
      <span class="label">نسخة اختبار API</span>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
        <label class="temp-wrap">
          <span class="label">Temperature</span>
          <input id="temperature" type="number" value="0.7" min="0" max="2" step="0.1" inputmode="decimal" />
        </label>
        <label class="temp-wrap">
          <span class="label">Access Key</span>
          <input id="accessKey" type="password" placeholder="اختياري" autocomplete="off" />
        </label>
      </div>
    </section>

    <section class="chat" id="chat">
      <div class="empty" id="emptyState">
        <div class="empty-card">
          <div class="hero">A</div>
          <h2>Ashur AI</h2>
          <p>واجهة تجريبية بسيطة لاختبار الاتصال بالنموذج عبر بروكسي الخادم.</p>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="message" rows="1" placeholder="اكتب رسالتك..." maxlength="12000"></textarea>
        <button class="send" id="sendBtn" type="button" aria-label="إرسال">↑</button>
      </div>
      <div class="footnote">Enter للإرسال · Shift + Enter لسطر جديد</div>
    </div>
  </main>

<script>
(() => {
  const PROXY_CANDIDATES = ["/api/chat", "/proxy.php"];
  const chat = document.getElementById("chat");
  const emptyState = document.getElementById("emptyState");
  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");
  const newChatBtn = document.getElementById("newChatBtn");
  const statusText = document.getElementById("statusText");
  const temperatureInput = document.getElementById("temperature");
  const accessKeyInput = document.getElementById("accessKey");

  let sending = false;
  let messages = loadMessages();
  let conversationId = localStorage.getItem("ashur_ai_conversation_id") || createConversationId();

  function createConversationId() {
    const id = "ashur_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("ashur_ai_conversation_id", id);
    return id;
  }

  function loadMessages() {
    try {
      const parsed = JSON.parse(localStorage.getItem("ashur_ai_messages") || "[]");
      return Array.isArray(parsed) ? parsed.slice(-40) : [];
    } catch {
      return [];
    }
  }

  function saveMessages() {
    localStorage.setItem("ashur_ai_messages", JSON.stringify(messages.slice(-40)));
  }

  function setStatus(text) {
    statusText.textContent = text;
  }

  function escapeTime() {
    return new Date().toLocaleTimeString("ar-IQ", { hour: "2-digit", minute: "2-digit" });
  }

  function renderMessages() {
    chat.querySelectorAll(".row,.error").forEach(el => el.remove());
    emptyState.style.display = messages.length ? "none" : "grid";

    for (const item of messages) {
      appendBubble(item.text, item.role, item.time, false);
    }

    scrollBottom();
  }

  function appendBubble(text, role, time = escapeTime(), save = true) {
    emptyState.style.display = "none";

    const row = document.createElement("div");
    row.className = "row " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const content = document.createElement("div");
    content.textContent = text;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = time;

    bubble.append(content, meta);
    row.appendChild(bubble);
    chat.appendChild(row);

    if (save) {
      messages.push({ text, role, time });
      saveMessages();
    }

    scrollBottom();
    return row;
  }

  function appendError(text) {
    const el = document.createElement("div");
    el.className = "error";
    el.textContent = text;
    chat.appendChild(el);
    scrollBottom();
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "row ai";
    row.id = "typingRow";
    row.innerHTML = '<div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
    chat.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById("typingRow")?.remove();
  }

  function scrollBottom() {
    requestAnimationFrame(() => {
      chat.scrollTop = chat.scrollHeight;
    });
  }

  function resizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  async function requestProxy(payload) {
    let lastError = null;

    for (const url of PROXY_CANDIDATES) {
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const raw = await response.text();

        let data = null;
        try {
          data = JSON.parse(raw);
        } catch {
          const looksLikeStaticHost =
            response.status === 404 ||
            response.status === 405 ||
            /^\s*</.test(raw);

          if (looksLikeStaticHost) {
            lastError = new Error(
              "المسار " + url + " لا يعمل كبروكسي على هذه الاستضافة"
            );
            continue;
          }

          throw new Error(
            "البروكسي أرجع استجابة غير صالحة: " + raw.slice(0, 250)
          );
        }

        return { response, data, url };

      } catch (error) {
        lastError = error;
      }
    }

    throw new Error(
      (lastError?.message || "لم يعمل أي مسار بروكسي") +
      ". إذا كنت تستخدم GitHub Pages فهي استضافة ثابتة ولا تشغل Node.js أو PHP؛ انشر المشروع على Vercel أو استضافة PHP."
    );
  }

  async function sendMessage() {
    if (sending) return;

    const text = input.value.trim();
    if (!text) return;

    let temperature = Number(temperatureInput.value);
    if (!Number.isFinite(temperature)) temperature = 0.7;
    temperature = Math.max(0, Math.min(2, temperature));
    temperatureInput.value = String(temperature);

    appendBubble(text, "user");
    input.value = "";
    resizeInput();

    sending = true;
    sendBtn.disabled = true;
    setStatus("جاري الاتصال...");
    addTyping();

    try {
      const { response, data, url: proxyUsed } = await requestProxy({
        text,
        temperature,
        conversation_id: conversationId,
        key: accessKeyInput?.value?.trim() || ""
      });

      console.log("Proxy used:", proxyUsed);

      removeTyping();

      if (!response.ok || data.status === false) {
        if (data.needs_key) {
          appendError("الخدمة الخارجية تطلب مفتاح وصول. ضع المفتاح مؤقتًا في حقل Access Key أو أضفه في Vercel كمتغير ASHUR_AI_ACCESS_KEY.");
        } else {
          appendError(data.error || ("خطأ HTTP " + response.status));
        }
        setStatus("حدث خطأ في الاتصال");
        return;
      }

      if (!data.response) {
        appendError("تم الاتصال لكن لم يصل نص رد من الخدمة.");
        setStatus("استجابة غير مكتملة");
        return;
      }

      if (data.conversation_id) {
        conversationId = String(data.conversation_id);
        localStorage.setItem("ashur_ai_conversation_id", conversationId);
      }

      appendBubble(String(data.response), "ai");
      setStatus(data.model ? "متصل · " + data.model : "متصل");

    } catch (error) {
      removeTyping();
      appendError("تعذر الاتصال: " + (error?.message || "خطأ غير معروف"));
      setStatus("غير متصل");
    } finally {
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function newChat() {
    messages = [];
    saveMessages();
    conversationId = createConversationId();
    renderMessages();
    setStatus("محادثة جديدة");
    input.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  newChatBtn.addEventListener("click", newChat);

  input.addEventListener("input", resizeInput);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  renderMessages();
  resizeInput();
})();
</script>
</body>
</html>
